spring.application.name=cellbank

spring.datasource.url=jdbc:postgresql://localhost:5432/cellbank
spring.datasource.username=cellbank_app
spring.datasource.password=${CELLBANK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB