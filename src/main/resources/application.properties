spring.application.name=cellbank

spring.datasource.url=jdbc:postgresql://localhost:5432/cellbank
spring.datasource.username=cellbank_app
spring.datasource.password=${CELLBANK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=31MB

# Email sender
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Session settings
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# OpenAI troubleshooting
cellbank.ai.openai.enabled=${OPENAI_ENABLED:false}
cellbank.ai.openai.api-key=${OPENAI_API_KEY:}
cellbank.ai.openai.model=${OPENAI_MODEL:gpt-6.1-sol}
cellbank.ai.openai.connect-timeout-seconds=10
cellbank.ai.openai.request-timeout-seconds=90