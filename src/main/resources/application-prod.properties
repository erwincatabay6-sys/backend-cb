# Hosting port
server.port=${PORT:8080}

# Production database
spring.datasource.url=${CELLBANK_DB_URL}
spring.datasource.username=${CELLBANK_DB_USERNAME}
spring.datasource.password=${CELLBANK_DB_PASSWORD}

# Public frontend URL used in verification and recovery emails
cellbank.frontend-url=${CELLBANK_FRONTEND_URL}

# HTTPS-only session cookie
server.servlet.session.cookie.secure=true

# Validate the existing database schema
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never